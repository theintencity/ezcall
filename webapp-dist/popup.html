<!doctype html><html><head><title>EzCall by Kundan Singh</title><meta name="viewport"content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no"><style type="text/css">button{width:50px;display:block;margin:0 auto;cursor:pointer}#logout{position:absolute;right:10px;cursor:pointer}body:not([noauth]) div.noauth,body[noauth] div.auth{display:none}span#more1,span#more2{float:left;cursor:pointer}[hidden]{display:none}</style></head><body noauth><div class="auth"><label for="email">Logged in as:</label> <span id="logout">Logout?</span><br><input id="email"type="text"readonly="readonly"><br><br><label for="target">Target to call</label><br><input id="target"type="text"list="callhistory"placeholder="user@domain"title="Enter the target to call"><br><br><datalist id="callhistory"></datalist><label for="topic">Topic for the call</label> <input id="topic"type="text"placeholder="Join my EzCall"title="Enter a topic for the call"><br><br><datalist id="callhistory"></datalist><div hidden><label for="confapp">Video conference web app</label><br><input id="confapp"type="text"placeholder="https://..."title="Enter the URL of the video conference app. Default is rtcbricks/media-chat-peer.html"><br><br></div><span id="more2">&#x22ee;</span> <button id="call">Call</button></div><div class="noauth"><label for="accesstoken">Enter your access token from signup email.</label><br><input id="accesstoken"type="text"placeholder="access token"title="Enter the access token you received in your signup email. Check Spam or Junk folder if email is not received soon."><br><br><div hidden><label for="notifyserver">Enter the notification server for login.</label><br><input id="notifyserver"type="text"placeholder="https://..."title="Enter the URL of the notification server. Default is https://ezinteract.kundansingh.com/contacts/"><br><br></div><span id="more1">&#x22ee;</span> <button id="login">Login</button></div><script src="popup.js"></script></body></html>
