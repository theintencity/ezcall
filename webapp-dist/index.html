<!doctype html><html><head><title>EzCall by Kundan Singh</title><meta name="viewport"content="width=240"><link rel="manifest"href="manifest-pwa.json"><script src="localforage.js"></script><style type="text/css">body{max-width:180px;max-height:200px;font-size:12px;font-family:sans-serif}button{width:50px;display:block;margin:0 auto;cursor:pointer}#logout{position:relative;right:0;cursor:pointer;margin-left:20px;user-select:none}body:not([noauth]) div.noauth,body[noauth] div.auth{display:none}select#existing{width:20ch}body[ext] label[for=existing],body[ext] select#existing{display:none}body:not([noauth]):not([nologin]) div.nologin,body[noauth] div.nologin{display:none}div.nologin{position:absolute;left:180px;top:10px;display:flex;flex-flow:column nowrap;width:180px}div.nologin>textarea{min-height:80px;width:100%;border:solid 1px #eee;resize:both}div.nologin>label#copyto{cursor:pointer}span#more1,span#more2{float:left;cursor:pointer}[hidden]{display:none}div.calls{margin-top:10px}div.calls>div{display:flex;flex-flow:column nowrap;height:20px;overflow:hidden}div.calls>div:nth-child(odd){background-color:#eee}div.calls>div>div.header{position:relative;display:flex;flex-flow:row nowrap;align-items:center}div.calls>div>div.header>button{position:relative;width:20px;height:20px;border:none;background:0 0;cursor:pointer}div.calls>div>div.header>button.back{pointer-events:none;display:none}div.calls>div:not([active=true])>div.header>button.back{display:none}div.calls>div[active=true]>div.header>button.close{order:-1}div.calls>div>div.header>span{position:relative;flex:1;text-align:center}div.calls>div>iframe{position:relative;border:none;width:0;height:0;flex:1}div.calls>div[active=true]{position:fixed;z-index:10;background:#fff;top:0;bottom:0;left:0;right:0;height:auto}div.calls>div[active=true]>div.header{background:grey}div.calls>div[active=true]>div.header>*{color:#fff}div.calls>div[active=true]>iframe{width:auto;height:auto}</style></head><body noauth><div class="auth"><label for="email">Logged in as:</label> <span id="logout">Logout?</span><br><input id="email"type="text"readonly="readonly"placeholder="Not logged in"><br><br><label for="target">Target to call</label><br><input id="target"type="text"list="callhistory"placeholder="user@domain"title="Enter the target to call"><br><br><datalist id="callhistory"></datalist><label for="topic">Topic for the call</label> <input id="topic"type="text"placeholder="Join my EzCall"title="Enter a topic for the call"><br><br><label for="existing">Invite to existing</label><br><select id="existing"title="Select an existing call to invite the target to"><option value="">Select an active call</option></select><br><br><datalist id="callhistory"></datalist><div hidden><label for="confapp">Video conference web app</label><br><input id="confapp"type="text"placeholder="https://..."title="Enter the URL of the video conference app. Default is rtcbricks/media-chat-peer.html"><br><br></div><span id="more2"title="More call options">&#x22ee;</span> <button id="call">Call</button><div class="calls"></div></div><div class="noauth"><label for="accesstoken">Enter your access token from signup email.</label><br><input id="accesstoken"type="text"placeholder="access token"title="Enter the access token you received in your signup email. Check Spam or Junk folder if email is not received soon."><br><br><div hidden><label for="notifyserver">Enter the notification server for login.</label><br><input id="notifyserver"type="text"placeholder="https://..."title="Enter the URL of the notification server. Default is https://ezinteract.kundansingh.com/contacts/"><br><br></div><span id="more1"title="More login options">&#x22ee;</span> <button id="login">Login</button><br><br><label>Or use email messages for call signaling, without login.</label> <button id="nologin">Email</button></div><div class="nologin"><label id="copyto">Send to other (copy to clipboard)</label> <textarea id="sendto"title="Send this text to the other side"
